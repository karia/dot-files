onboarding = false
[keys]
prefix = "ctrl+z"

# pane 移動: hjkl に加えて上下左右の矢印キーも有効化（tmux 風）
focus_pane_left  = ["prefix+h", "prefix+left"]
focus_pane_down  = ["prefix+j", "prefix+down"]
focus_pane_up    = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# workspace navigate（prefix+w 後）: up/down に加えて j/k も有効化
navigate_workspace_up   = ["up", "k"]
navigate_workspace_down = ["down", "j"]

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
# herdr-automatic-rename: 新規タブの名前入力を手リネーム扱いにしない
prompt_new_tab_name = false

# タブ行右端のステータス領域（hostname/datetime は herdr 組み込み、他は status.sh）
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "command", command = "~/.config/herdr/status.sh mem", interval_seconds = 10, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/status.sh uptime", interval_seconds = 60, timeout_seconds = 2 },
  { type = "datetime", format = "%m/%d(%a) %H:%M:%S" },
]
tab_bar_right_separator = " · "

# タブ行は下端に置く
tab_bar_position = "bottom"

# エージェント完了を OS 通知で受け取る
[ui.toast]
delivery = "system"

# herdr-file-viewer: prefix+f で split 起動
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "Open file viewer in split pane"

# prefix+shift+f でタブ起動
[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "Open file viewer in new tab"

# herdr-plugin-hunk: prefix+d で worktree diff
[[keys.command]]
key = "prefix+d"
type = "shell"
command = "herdr plugin action invoke hunk.diff.worktree-split"
description = "Open worktree diff in split pane"

[experimental]
# prefix モードの間だけ macOS の入力ソースを ASCII 系に切り替え、抜けたら元の入力ソースに戻す
switch_ascii_input_source_in_prefix = true
