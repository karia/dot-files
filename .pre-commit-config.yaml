default_stages: [pre-commit]
# .p10k.zsh は p10k configure の生成物。整形するとウィザードの出力と差が生じ、
# テンプレートとの差分比較で更新分を追えなくなるため対象外にする
exclude: ^\.p10k\.zsh$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # Claude Code は UI 操作のたびに ~/.claude/settings.json を書き直し、キー順が変わる。
      # 整形してキー順を固定し、差分を実質の変更だけにする
      - id: pretty-format-json
        args: [--autofix, --indent=2]
        files: ^\.claude/settings\.json$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        exclude: \.zsh(rc|env)$
  - repo: https://github.com/google/yamlfmt
    rev: v0.13.0
    hooks:
      - id: yamlfmt
